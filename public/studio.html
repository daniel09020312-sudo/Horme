<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/studio.css">
  <title>Ὁρμή Studio</title>
</head>
<body class="studio">
  <header class="st-top">
    <a class="st-back" href="index.html" aria-label="홈 화면으로">
      <svg class="g" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>홈 화면</span>
    </a>
    <div class="st-brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>Ὁρμή <b>STUDIO</b></span></div>
    <div class="st-top-right">
      <span class="st-saved" id="st-saved" role="status" aria-live="polite">자동 저장</span>
      <button type="button" class="pill-btn st-preview-btn" id="st-preview-open"><svg class="g" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span>미리보기</span></button>
    </div>
  </header>

  <div class="st-main">
    <nav class="st-steps" id="st-steps" aria-label="디자인 단계"></nav>
    <main class="st-panel" id="st-panel" tabindex="-1"></main>
    <aside class="st-preview" id="st-preview" aria-label="실시간 미리보기">
      <div class="st-preview-head">
        <div><p class="st-over">LIVE PREVIEW</p><h2>실시간 미리보기</h2></div>
        <div class="seg st-devices" id="st-devices" role="radiogroup" aria-label="기기"></div>
        <button type="button" class="icon-btn st-preview-close" id="st-preview-close" aria-label="미리보기 닫기"><svg class="g" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
      <div class="st-stage" id="st-stage"><div class="st-device" id="st-device"><iframe id="st-frame" title="Ὁρμή 미리보기" src="index.html?preview=1"></iframe></div></div>
      <p class="st-preview-note">미리보기 안에서도 넘기고 눌러 볼 수 있어요. 앱은 실행되지 않아요.</p>
    </aside>
  </div>

  <script src="js/core/util.js" defer></script>
  <script src="js/core/glyphs.js" defer></script>
  <script src="js/core/catalog.js" defer></script>
  <script src="js/widgets/types.js" defer></script>
  <script src="js/core/schema.js" defer></script>
  <script src="js/core/store.js" defer></script>
  <script src="js/core/assets.js" defer></script>
  <script src="js/core/ui.js" defer></script>
  <script src="js/core/theme.js" defer></script>
  <script src="js/core/launch.js" defer></script>
  <script src="js/core/backup.js" defer></script>
  <script src="js/core/pack.js" defer></script>
  <script src="js/widgets/weather.js" defer></script>
  <script src="js/widgets/editor.js" defer></script>
  <script src="js/studio/prompts.js" defer></script>
  <script src="js/studio/studio.js" defer></script>
</body>
</html>
